[project]
name = "labproflix"
version = "1.0.0"
description = "Movie streaming platform built with Django, PostgreSQL, Redis and Cloudflare R2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.35.0",
    "Django==5.1",
    "django-storages==1.14.4",
    "gunicorn==23.0.0",
    "pillow==10.4.0",
    "psycopg2==2.9.9",
    "PyJWT==2.9.0",
    "python-dotenv==1.0.1",
    "pytz==2024.1",
    "redis==5.0.8",
    "requests==2.32.3",
    "whitenoise==6.7.0",
]

[tool.uv]
package = false

[project]
name = "labproflix"
version = "1.0.0"
description = "Movie streaming platform built with Django, PostgreSQL, Redis and Cloudflare R2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
    "Django>=5.2.9,<6.0",
    "django-storages>=1.14.4",
    "gunicorn>=23.0.0",
    "pillow>=12.3.0",
    "psycopg2>=2.9.9",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.2.2",
    "pytz>=2024.1",
    "redis>=5.0.8",
    "requests>=2.33.0",
    "whitenoise>=6.7.0",
]

[tool.uv]
package = false
